model_config:
  model_name_or_path: "Qwen/Qwen3.5-2B"
  trust_remote_code: true
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  use_cache: false

data_config:
  train_data_path: "datasets/train.json"
  val_data_path: "datasets/validation.json"
  video_root: "/path/to/ssv2/videos"
  video_ext: ".webm"
  sample_frames: 8
  train_subset_size: null
  eval_subset_size: 300
  preprocessing_num_workers: 4

objective_config:
  contrastive_temperature: 0.1
  contrastive_weight: 0.1
  lm_weight: 1.0
  num_negative_samples: 16
  contrastive_hidden_layer_start: 21
  contrastive_hidden_layer_end: 24

training_config:
  output_dir: "outputs/checkpoints"
  max_steps: 2250
  num_train_epochs: 10
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.00001
  weight_decay: 0.01
  lr_scheduler_type: "cosine"
  lr_scheduler_total_steps: 15000
  warmup_steps: 450
  max_grad_norm: 1.0

  optim: "adamw_torch"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 0.00000001

  fp16: false
  bf16: true
  tf32: true

  eval_strategy: "steps"
  eval_steps: 750
  save_strategy: "steps"
  save_steps: 750
  save_total_limit: null
  load_best_model_at_end: false

  logging_steps: 1
  report_to: []
  contrastive_variant_forward_chunk_size: 17

  seed: 1234
  data_seed: 1234
  dataloader_num_workers: 4
  remove_unused_columns: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  ddp_find_unused_parameters: false
  dataloader_pin_memory: false

distributed_config:
  preserve_effective_batch_size: true

lora_config:
  r: 8
  lora_alpha: 32
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  inference_mode: false
  modules_to_save: []

wandb_config: {}
